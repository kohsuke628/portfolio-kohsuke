<!DOCTYPE html>
<head>
  <title>Exercise 13</title>
  <style>
    .square {
      width: 100px;
      height: 100px;
      background-color: pink;
      margin-bottom: 20px;
      padding: 2px 5px;
      box-sizing: border-box;
      transition: width 0.1s, height 0.1s;
    }

    /* Square 1: becomes longer on hover */
    #square1:hover {
      width: 400px;
    }

    /* Square 2: becomes larger on hover */
    #square2:hover {
      width: 120px;
      height: 200px;
    }
  </style>
</head>
<body>

  <div id="square1" class="square">1</div>
  <div id="square2" class="square">2</div>

</body>
</html>
