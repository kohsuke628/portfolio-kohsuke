<!DOCTYPE html>
<html>
<head>
<style>
p.solid {
  border-style: double;
  background-color: lightblue;
  border-color: red;
}

p.rounded {
  border-style: solid;
  background-color: yellow;
  border-color: lightskyblue;
  border-radius: 5px;
}

p.dashed {
  border-style: dotted;
  background-color: limegreen;
  border-color: plum;
}
</style>
</head>
<body>

<p class="solid">Hello World</p>
<p>border-style: double;
  background-color: lightblue;
  border-color: red;</p>
<p class="rounded">Hello World</p>
<p> border-style: solid;
  background-color: yellow;
  border-color: lightskyblue; </p>
<p class="dashed">Hello World</p>
<p> border-style: dotted;
  background-color: limegreen;
  border-color: plum;</p>

</body>
</html>
